services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: excel_trainer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: excel_trainer
    volumes:
      # postgres:18+ stores data in versioned subdirectories — mount the
      # parent, not /var/lib/postgresql/data (refused by the image).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excel_trainer -d excel_trainer"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies drizzle migrations, then exits. The app waits for it.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://excel_trainer:${POSTGRES_PASSWORD}@db:5432/excel_trainer
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        BASE_URL: ${BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # In-network URL to the db service (overrides the local dev value in .env).
      DATABASE_URL: postgres://excel_trainer:${POSTGRES_PASSWORD}@db:5432/excel_trainer
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
