services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Bounded logs (RODO storage limitation) — applies on container recreate.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: excel_trainer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: excel_trainer
    volumes:
      # postgres:18+ stores data in versioned subdirectories — mount the
      # parent, not /var/lib/postgresql/data (refused by the image).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excel_trainer -d excel_trainer"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies drizzle migrations, then exits. The app waits for it.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgres://excel_trainer:${POSTGRES_PASSWORD}@db:5432/excel_trainer
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        BASE_URL: ${BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # In-network URL to the db service (overrides the local dev value in .env).
      DATABASE_URL: postgres://excel_trainer:${POSTGRES_PASSWORD}@db:5432/excel_trainer
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Edge variant A: direct HTTPS via Let's Encrypt. Requires open ports 80/443.
  # Start with: docker compose --profile caddy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # Edge variant B: Cloudflare Tunnel (no open ports; for NAT'd VPS like mikr.us).
  # Start with: docker compose --profile tunnel up -d and TUNNEL_TOKEN in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
